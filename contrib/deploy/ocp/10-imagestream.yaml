apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: pe-forekat-admin
  namespace: pe-forekat-admin-prod
  labels:
    app.kubernetes.io/name: pe-forekat-admin
    app.kubernetes.io/part-of: pe-forekat-admin
spec:
  lookupPolicy:
    local: true
  tags:
    - name: "latest"
      annotations:
        description: ForeKat Admin image from Nexus
      from:
        kind: DockerImage
        name: docker-registry.platform.is/pe/apps/pe-forekat-admin:latest
      importPolicy:
        scheduled: true
      referencePolicy:
        type: Local
